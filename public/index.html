<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imarika Loans - Fast, Safe, Reliable</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .bg-dark-green { background-color: #0f2b1c; }
        .text-dark-green { color: #0f2b1c; }
        .btn-dark-green { background-color: #0f2b1c; }
        .btn-dark-green:hover { background-color: #17442c; }
        .curved-header { border-bottom-left-radius: 50% 20px; border-bottom-right-radius: 50% 20px; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <!-- Mobile Device Container -->
    <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl overflow-hidden relative">
        
        <!-- Header Section -->
        <div class="bg-dark-green curved-header pt-10 pb-16 px-6 text-center text-white relative">
            <!-- Logo Placeholder -->
            <div class="flex justify-center mb-2">
                <svg class="w-12 h-12 text-emerald-500" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2L2 22h20L12 2zm0 4.5l6.5 13.5h-13L12 6.5z"/>
                </svg>
            </div>
            <h1 class="text-3xl font-bold tracking-wide">Imarika Loans</h1>
            <p class="text-sm mt-1 text-gray-300">Fast • Safe • Reliable</p>
            <p class="text-xs mt-2 text-gray-400">Your financial growth is our priority</p>
        </div>

        <!-- Content Section -->
        <div class="px-6 pb-8 -mt-6 bg-white relative z-10 rounded-t-3xl">
            <h2 class="text-2xl font-bold text-gray-800 mt-4" id="formTitle">Welcome Back</h2>
            <p class="text-sm text-gray-500 mt-1 mb-6" id="formSubtitle">Log in to your Imarika Loans account to access your loans and wallet.</p>

            <!-- Error/Success Message -->
            <div id="messageBox" class="hidden text-sm p-3 rounded-lg mb-4"></div>

            <!-- Form -->
            <form id="authForm" class="space-y-4">
                <!-- Name Field (Hidden by default, shown on Signup) -->
                <div id="nameField" class="hidden relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    </span>
                    <input type="text" id="name" placeholder="Full Name" class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent">
                </div>

                <!-- Email Field -->
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                    </span>
                    <input type="email" id="email" placeholder="Enter your email" required class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent">
                </div>

                <!-- Password Field -->
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                    </span>
                    <input type="password" id="password" placeholder="Password" required class="w-full pl-10 pr-10 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent">
                    <span class="absolute inset-y-0 right-0 flex items-center pr-3 cursor-pointer text-gray-400" onclick="togglePassword()">
                        <svg id="eyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                    </span>
                </div>

                <!-- Remember Me & Forgot Password -->
                <div class="flex items-center justify-between mt-2" id="optionsRow">
                    <label class="flex items-center text-sm text-gray-600">
                        <input type="checkbox" class="w-4 h-4 text-emerald-600 border-gray-300 rounded focus:ring-emerald-500">
                        <span class="ml-2">Remember me</span>
                    </label>
                    <a href="#" class="text-sm font-semibold text-emerald-600 hover:text-emerald-700">Forgot password?</a>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submitBtn" class="w-full btn-dark-green text-white font-semibold py-3 rounded-xl transition duration-200 mt-4">
                    Log In
                </button>
            </form>

            <!-- Divider -->
            <div class="flex items-center my-6">
                <div class="flex-grow border-t border-gray-300"></div>
                <span class="flex-shrink-0 mx-4 text-gray-400 text-sm">OR</span>
                <div class="flex-grow border-t border-gray-300"></div>
            </div>

            <!-- OAuth Buttons -->
            <div class="space-y-3">
                <a href="/api/auth/google" class="w-full flex items-center justify-center border border-gray-300 py-3 rounded-xl hover:bg-gray-50 transition duration-200">
                    <!-- Google SVG Logo -->
                    <svg class="w-5 h-5 mr-3" viewBox="0 0 24 24">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                    </svg>
                    <span class="text-gray-700 font-medium">Login with Google</span>
                </a>
                <a href="/api/auth/github" class="w-full flex items-center justify-center border border-gray-300 py-3 rounded-xl hover:bg-gray-50 transition duration-200">
                    <!-- GitHub SVG Logo -->
                    <svg class="w-5 h-5 mr-3" fill="currentColor" viewBox="0 0 24 24">
                        <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
                    </svg>
                    <span class="text-gray-700 font-medium">Login with GitHub</span>
                </a>
            </div>

            <!-- Toggle Sign Up / Login -->
            <p class="text-center text-sm text-gray-600 mt-6">
                <span id="toggleText">Don't have an account?</span> 
                <a href="#" id="toggleLink" class="font-semibold text-emerald-600 hover:text-emerald-700">Sign Up</a>
            </p>

            <!-- Footer Secure Note -->
            <div class="flex items-center justify-center mt-8 text-xs text-gray-400">
                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                Your data is safe and secure
            </div>
        </div>
    </div>

    <!-- Frontend Logic -->
    <script>
        // Check URL parameters for OAuth token redirect
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const name = urlParams.get('name');
        const error = urlParams.get('error');

        if (token) {
            localStorage.setItem('imarika_token', token);
            localStorage.setItem('imarika_user', name);
            showMessage(`Welcome back, ${name}! Redirecting to dashboard...`, 'success');
            setTimeout(() => {
                // In a real app, redirect to /dashboard.html
                alert(`Login Successful! Token: ${token}\nIn a full app, you would now be redirected to your dashboard.`);
            }, 1500);
        } else if (error) {
            showMessage('Authentication failed. Please try again.', 'error');
        }

        // UI Elements
        const formTitle = document.getElementById('formTitle');
        const formSubtitle = document.getElementById('formSubtitle');
        const nameField = document.getElementById('nameField');
        const optionsRow = document.getElementById('optionsRow');
        const submitBtn = document.getElementById('submitBtn');
        const toggleLink = document.getElementById('toggleLink');
        const toggleText = document.getElementById('toggleText');
        const authForm = document.getElementById('authForm');
        const messageBox = document.getElementById('messageBox');

        let isLogin = true;

        // Toggle between Login and Signup
        toggleLink.addEventListener('click', (e) => {
            e.preventDefault();
            isLogin = !isLogin;

            if (isLogin) {
                formTitle.innerText = 'Welcome Back';
                formSubtitle.innerText = 'Log in to your Imarika Loans account to access your loans and wallet.';
                nameField.classList.add('hidden');
                optionsRow.classList.remove('hidden');
                submitBtn.innerText = 'Log In';
                toggleText.innerText = "Don't have an account?";
                toggleLink.innerText = 'Sign Up';
            } else {
                formTitle.innerText = 'Create Account';
                formSubtitle.innerText = 'Sign up to start your journey to financial growth with Imarika Loans.';
                nameField.classList.remove('hidden');
                optionsRow.classList.add('hidden');
                submitBtn.innerText = 'Sign Up';
                toggleText.innerText = "Already have an account?";
                toggleLink.innerText = 'Log In';
            }
            messageBox.classList.add('hidden');
        });

        // Toggle Password Visibility
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.add('text-emerald-600');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('text-emerald-600');
            }
        }

        // Handle Form Submission
        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const endpoint = isLogin ? '/api/auth/login' : '/api/auth/register';
            const payload = isLogin ? { email, password } : { name, email, password };

            try {
                submitBtn.disabled = true;
                submitBtn.innerText = 'Processing...';

                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Something went wrong');
                }

                localStorage.setItem('imarika_token', data.token);
                localStorage.setItem('imarika_user', data.user.name);
                showMessage(`Success! Welcome ${data.user.name}. Redirecting...`, 'success');
                
                setTimeout(() => {
                    alert(`Login Successful! Token: ${data.token}\nIn a full app, you would now be redirected to your dashboard.`);
                }, 1500);

            } catch (err) {
                showMessage(err.message, 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = isLogin ? 'Log In' : 'Sign Up';
            }
        });

        // Helper to show messages
        function showMessage(msg, type) {
            messageBox.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-green-100', 'text-green-700');
            if (type === 'error') {
                messageBox.classList.add('bg-red-100', 'text-red-700');
            } else {
                messageBox.classList.add('bg-green-100', 'text-green-700');
            }
            messageBox.innerText = msg;
        }
    </script>
</body>
</html>
