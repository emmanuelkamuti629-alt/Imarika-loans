<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imarika Loans</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .tab-active { color: #10b981; }
    .tab-inactive { color: #6b7280; }
    /* Hide scrollbar for Chrome, Safari and Opera */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    /* Hide scrollbar for IE, Edge and Firefox */
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen">

  <!-- Mobile Mockup Container -->
  <div class="w-full max-w-md h-[850px] bg-[#0B2E20] rounded-[35px] shadow-2xl overflow-hidden flex flex-col relative border-[8px] border-gray-800">
    
    <!-- Top Status Bar -->
    <div class="flex justify-between items-center px-6 pt-3 pb-2 text-white text-xs font-semibold">
      <span>9:41</span>
      <div class="flex gap-1.5 items-center">
        <span>📶</span> <span>📶</span> <span>🔋</span>
      </div>
    </div>

    <!-- Main Content Area -->
    <div class="flex-1 overflow-y-auto no-scrollbar pb-20" id="app-content">
      <!-- Dynamic content will be injected here -->
    </div>

    <!-- Bottom Navigation -->
    <div class="absolute bottom-0 w-full bg-white border-t border-gray-200 flex justify-around items-center py-3 px-2 text-xs z-50">
      <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center gap-1 tab-active">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
        <span>Home</span>
      </button>
      <button onclick="switchTab('loans')" id="nav-loans" class="flex flex-col items-center gap-1 tab-inactive">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        <span>Loans</span>
      </button>
      <button onclick="switchTab('wallet')" id="nav-wallet" class="flex flex-col items-center gap-1 tab-inactive">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>
        <span>Wallet</span>
      </button>
      <button onclick="switchTab('transactions')" id="nav-transactions" class="flex flex-col items-center gap-1 tab-inactive">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
        <span>History</span>
      </button>
      <button onclick="switchTab('profile')" id="nav-profile" class="flex flex-col items-center gap-1 tab-inactive">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
        <span>Profile</span>
      </button>
    </div>
  </div>

  <script>
    // --- State Management ---
    let state = {
      currentTab: 'home',
      user: { name: 'Emmanuel', limit: 50000, walletBalance: 12350 },
      activeLoan: { amount: 20000, repaid: 8000, dueDate: '12 Nov 2026', nextPayment: 2500, status: 'Active' },
      transactions: [
        { id: 1, type: 'Loan Disbursed', amount: 20000, date: '10 Oct 2026', status: 'Success', icon: '📥' },
        { id: 2, type: 'Repayment', amount: -2500, date: '08 Oct 2026', status: 'Success', icon: '📤' },
        { id: 3, type: 'Wallet Top Up', amount: 5000, date: '05 Oct 2026', status: 'Success', icon: '💳' }
      ],
      loanForm: { amount: 5000, term: 30, purpose: 'Business' }
    };

    // --- Format Currency ---
    const fmt = (num) => new Intl.NumberFormat('en-KE', { style: 'currency', currency: 'KES' }).format(num);

    // --- Tab Switching ---
    function switchTab(tab) {
      state.currentTab = tab;
      
      // Update Nav UI
      ['home', 'loans', 'wallet', 'transactions', 'profile'].forEach(t => {
        const btn = document.getElementById(`nav-${t}`);
        if (t === tab) {
          btn.classList.remove('tab-inactive');
          btn.classList.add('tab-active');
        } else {
          btn.classList.add('tab-inactive');
          btn.classList.remove('tab-active');
        }
      });

      render();
    }

    // --- Render Functions ---
    function render() {
      const content = document.getElementById('app-content');
      
      if (state.currentTab === 'home') content.innerHTML = renderHome();
      if (state.currentTab === 'loans') content.innerHTML = renderLoans();
      if (state.currentTab === 'wallet') content.innerHTML = renderWallet();
      if (state.currentTab === 'transactions') content.innerHTML = renderTransactions();
      if (state.currentTab === 'profile') content.innerHTML = renderProfile();
    }

    function renderHome() {
      return `
        <div class="p-5 text-white">
          <div class="flex justify-between items-center mb-6">
            <div>
              <p class="text-sm text-gray-300">Hello, ${state.user.name}</p>
              <p class="text-xs text-gray-400">Here's your financial overview</p>
            </div>
            <div class="w-10 h-10 bg-gray-700 rounded-full flex items-center justify-center">🔔</div>
          </div>

          <!-- Available Limit Card -->
          <div class="bg-[#1A4D33] rounded-2xl p-5 mb-5 border border-[#2A6D4A]">
            <p class="text-xs text-gray-300 mb-1">Available Loan Limit</p>
            <h1 class="text-3xl font-bold mb-4">${fmt(state.user.limit)}</h1>
            <button onclick="switchTab('loans')" class="bg-[#10b981] text-white text-sm font-semibold px-4 py-2 rounded-lg">Apply for Loan</button>
          </div>

          <!-- Active Loan Summary -->
          ${state.activeLoan ? `
          <div class="bg-[#1A4D33] rounded-2xl p-4 mb-5 border border-[#2A6D4A]">
            <div class="flex justify-between text-xs text-gray-300 mb-2">
              <span>Active Loan</span>
              <span class="text-[#10b981]">${state.activeLoan.status}</span>
            </div>
            <div class="flex justify-between items-end mb-3">
              <div>
                <p class="text-xs text-gray-400">Outstanding</p>
                <p class="text-xl font-bold">${fmt(state.activeLoan.amount - state.activeLoan.repaid)}</p>
              </div>
              <div class="text-right">
                <p class="text-xs text-gray-400">Next Payment</p>
                <p class="text-sm font-semibold">${fmt(state.activeLoan.nextPayment)}</p>
              </div>
            </div>
            <div class="w-full bg-[#0B2E20] rounded-full h-2 mb-2">
              <div class="bg-[#10b981] h-2 rounded-full" style="width: ${(state.activeLoan.repaid / state.activeLoan.amount) * 100}%"></div>
            </div>
            <p class="text-xs text-gray-400 text-right">Due: ${state.activeLoan.dueDate}</p>
          </div>
          ` : ''}

          <!-- Quick Actions -->
          <h3 class="text-sm font-semibold mb-3">Quick Actions</h3>
          <div class="grid grid-cols-3 gap-3 mb-6">
            <button onclick="switchTab('loans')" class="bg-[#1A4D33] p-3 rounded-xl flex flex-col items-center gap-2 border border-[#2A6D4A]">
              <span class="text-xl">💰</span>
              <span class="text-[10px]">Apply</span>
            </button>
            <button onclick="switchTab('wallet')" class="bg-[#1A4D33] p-3 rounded-xl flex flex-col items-center gap-2 border border-[#2A6D4A]">
              <span class="text-xl">💳</span>
              <span class="text-[10px]">Wallet</span>
            </button>
            <button onclick="switchTab('transactions')" class="bg-[#1A4D33] p-3 rounded-xl flex flex-col items-center gap-2 border border-[#2A6D4A]">
              <span class="text-xl">📜</span>
              <span class="text-[10px]">History</span>
            </button>
          </div>

          <!-- Recent Transactions -->
          <div class="flex justify-between items-center mb-3">
            <h3 class="text-sm font-semibold">Recent Transactions</h3>
            <button onclick="switchTab('transactions')" class="text-xs text-[#10b981]">View all</button>
          </div>
          ${state.transactions.slice(0,3).map(t => `
            <div class="flex justify-between items-center py-3 border-b border-[#2A6D4A] last:border-0">
              <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-[#1A4D33] rounded-full flex items-center justify-center text-xs">${t.icon}</div>
                <div>
                  <p class="text-xs font-semibold">${t.type}</p>
                  <p class="text-[10px] text-gray-400">${t.date}</p>
                </div>
              </div>
              <p class="text-xs font-semibold ${t.amount > 0 ? 'text-[#10b981]' : 'text-red-400'}">${t.amount > 0 ? '+' : ''}${fmt(t.amount)}</p>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderLoans() {
      const fee = state.loanForm.amount * 0.10;
      const totalRepay = state.loanForm.amount * 1.08; // 8% interest

      return `
        <div class="p-5 text-white">
          <h2 class="text-lg font-bold mb-4">Apply for Loan</h2>
          
          <div class="bg-[#1A4D33] rounded-2xl p-5 mb-5 border border-[#2A6D4A]">
            <p class="text-xs text-gray-300 mb-2">How much do you need?</p>
            <h1 class="text-3xl font-bold mb-4">${fmt(state.loanForm.amount)}</h1>
            
            <input type="range" min="1000" max="50000" step="1000" value="${state.loanForm.amount}" 
              oninput="updateLoanAmount(this.value)"
              class="w-full h-2 bg-[#0B2E20] rounded-lg appearance-none cursor-pointer accent-[#10b981] mb-6">
            
            <div class="flex justify-between text-[10px] text-gray-400 mb-4">
              <span>Min: KES 1,000</span>
              <span>Max: KES 50,000</span>
            </div>

            <p class="text-xs text-gray-300 mb-2">Loan Term</p>
            <div class="grid grid-cols-3 gap-2 mb-6">
              ${[7, 14, 30].map(days => `
                <button onclick="updateLoanTerm(${days})" class="py-2 rounded-lg text-xs font-semibold ${state.loanForm.term === days ? 'bg-[#10b981] text-white' : 'bg-[#0B2E20] text-gray-300 border border-[#2A6D4A]'}">
                  ${days} days
                </button>
              `).join('')}
            </div>

            <div class="bg-[#0B2E20] rounded-xl p-3 mb-6 border border-[#2A6D4A]">
              <div class="flex justify-between text-xs mb-2">
                <span class="text-gray-400">Upfront Fee (10%)</span>
                <span class="font-semibold text-yellow-400">${fmt(fee)}</span>
              </div>
              <div class="flex justify-between text-xs mb-2">
                <span class="text-gray-400">Interest (8%)</span>
                <span class="font-semibold">${fmt(state.loanForm.amount * 0.08)}</span>
              </div>
              <div class="flex justify-between text-xs border-t border-[#2A6D4A] pt-2 mt-2">
                <span class="text-gray-400">Total Repayment</span>
                <span class="font-bold text-[#10b981]">${fmt(totalRepay)}</span>
              </div>
            </div>

            <!-- Transparency Warning -->
            <div class="bg-yellow-900/30 border border-yellow-700/50 rounded-lg p-3 mb-6">
              <p class="text-[10px] text-yellow-200 leading-relaxed">
                ⚠️ <strong>Important:</strong> To activate this loan, you must pay a 10% upfront fee of <strong>${fmt(fee)}</strong> via M-Pesa. The loan amount will be disbursed to your wallet immediately after.
              </p>
            </div>

            <button onclick="applyLoan()" class="w-full bg-[#10b981] text-white font-bold py-3 rounded-xl text-sm">Continue to Payment</button>
          </div>
        </div>
      `;
    }

    function renderWallet() {
      return `
        <div class="p-5 text-white">
          <h2 class="text-lg font-bold mb-4">Wallet</h2>
          <div class="bg-[#10b981] rounded-2xl p-5 mb-5 text-white">
            <p class="text-xs opacity-80 mb-1">Available Balance</p>
            <h1 class="text-3xl font-bold mb-4">${fmt(state.user.walletBalance)}</h1>
            <div class="flex gap-2">
              <button class="bg-white/20 px-4 py-2 rounded-lg text-xs font-semibold flex-1">Withdraw</button>
              <button class="bg-white/20 px-4 py-2 rounded-lg text-xs font-semibold flex-1">Send</button>
            </div>
          </div>
          
          <div class="bg-[#1A4D33] rounded-xl p-4 mb-5 border border-[#2A6D4A] flex justify-between items-center">
            <div>
              <p class="text-xs text-gray-300">Pending Balance</p>
              <p class="text-sm font-semibold">KES 0.00</p>
            </div>
            <p class="text-[10px] text-gray-400 w-1/2 text-right">Funds awaiting clearance from M-Pesa</p>
          </div>

          <h3 class="text-sm font-semibold mb-3">Recent Activity</h3>
          ${state.transactions.map(t => `
            <div class="flex justify-between items-center py-3 border-b border-[#2A6D4A] last:border-0">
              <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-[#1A4D33] rounded-full flex items-center justify-center text-xs">${t.icon}</div>
                <div>
                  <p class="text-xs font-semibold">${t.type}</p>
                  <p class="text-[10px] text-gray-400">${t.date}</p>
                </div>
              </div>
              <p class="text-xs font-semibold ${t.amount > 0 ? 'text-[#10b981]' : 'text-red-400'}">${t.amount > 0 ? '+' : ''}${fmt(t.amount)}</p>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderTransactions() {
      return `
        <div class="p-5 text-white">
          <h2 class="text-lg font-bold mb-4">Transaction History</h2>
          <div class="flex gap-2 mb-4 overflow-x-auto no-scrollbar">
            <button class="bg-[#10b981] text-white text-xs px-3 py-1 rounded-full">All</button>
            <button class="bg-[#1A4D33] text-gray-300 text-xs px-3 py-1 rounded-full border border-[#2A6D4A]">Loans</button>
            <button class="bg-[#1A4D33] text-gray-300 text-xs px-3 py-1 rounded-full border border-[#2A6D4A]">Payments</button>
          </div>
          ${state.transactions.map(t => `
            <div class="flex justify-between items-center py-3 border-b border-[#2A6D4A] last:border-0">
              <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-[#1A4D33] rounded-full flex items-center justify-center text-xs">${t.icon}</div>
                <div>
                  <p class="text-xs font-semibold">${t.type}</p>
                  <p class="text-[10px] text-gray-400">${t.date} • ${t.status}</p>
                </div>
              </div>
              <p class="text-xs font-semibold ${t.amount > 0 ? 'text-[#10b981]' : 'text-red-400'}">${t.amount > 0 ? '+' : ''}${fmt(t.amount)}</p>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderProfile() {
      return `
        <div class="p-5 text-white">
          <div class="flex items-center gap-4 mb-6">
            <div class="w-16 h-16 bg-[#1A4D33] rounded-full flex items-center justify-center text-2xl border-2 border-[#10b981]">👤</div>
            <div>
              <h2 class="text-lg font-bold">${state.user.name} Kamuti</h2>
              <p class="text-xs text-gray-400">+254 712 345 678</p>
              <span class="text-[10px] bg-[#10b981]/20 text-[#10b981] px-2 py-0.5 rounded-full mt-1 inline-block">✅ Verified</span>
            </div>
          </div>

          <div class="space-y-4">
            <div class="bg-[#1A4D33] rounded-xl p-4 border border-[#2A6D4A] flex justify-between items-center">
              <div>
                <p class="text-xs text-gray-300">Loan Limits</p>
                <p class="text-sm font-semibold">${fmt(state.user.limit)}</p>
              </div>
              <span class="text-gray-400">›</span>
            </div>
            <div class="bg-[#1A4D33] rounded-xl p-4 border border-[#2A6D4A] flex justify-between items-center">
              <div>
                <p class="text-xs text-gray-300">Referral Program</p>
                <p class="text-sm font-semibold">Invite & Earn</p>
              </div>
              <span class="text-gray-400">›</span>
            </div>
            <div class="bg-[#1A4D33] rounded-xl p-4 border border-[#2A6D4A] flex justify-between items-center">
              <div>
                <p class="text-xs text-gray-300">Settings & Security</p>
                <p class="text-sm font-semibold">Password, Biometrics</p>
              </div>
              <span class="text-gray-400">›</span>
            </div>
            <div class="bg-[#1A4D33] rounded-xl p-4 border border-[#2A6D4A] flex justify-between items-center">
              <div>
                <p class="text-xs text-gray-300">Help & Support</p>
                <p class="text-sm font-semibold">FAQs, Live Chat</p>
              </div>
              <span class="text-gray-400">›</span>
            </div>
          </div>

          <button class="w-full mt-6 border border-red-500/50 text-red-400 font-semibold py-3 rounded-xl text-sm">Logout</button>
        </div>
      `;
    }

    // --- Event Handlers ---
    function updateLoanAmount(val) {
      state.loanForm.amount = parseInt(val);
      render();
    }

    function updateLoanTerm(days) {
      state.loanForm.term = days;
      render();
    }

    async function applyLoan() {
      const fee = state.loanForm.amount * 0.10;
      
      // Simulate API Call to Backend
      const btn = event.target;
      btn.innerText = 'Processing...';
      btn.disabled = true;

      try {
        // 1. Create Loan in DB
        // const res = await fetch('/api/loan/apply', {
        //   method: 'POST',
        //   headers: { 'Content-Type': 'application/json' },
        //   body: JSON.stringify({ userId: 'mock_user_id', amount: state.loanForm.amount, termDays: state.loanForm.term })
        // });
        
        // 2. Trigger Payhero STK Push
        // await fetch('/api/payhero/stk-push', { ... })

        // Mock Success Flow
        setTimeout(() => {
          alert(`Loan Application Received!\n\nA Payhero STK Push for ${fmt(fee)} (10% upfront fee) has been sent to your phone. Please enter your M-Pesa PIN to activate the loan.`);
          btn.innerText = 'Continue to Payment';
          btn.disabled = false;
        }, 1500);

      } catch (error) {
        alert('Error applying for loan');
        btn.innerText = 'Continue to Payment';
        btn.disabled = false;
      }
    }

    // Initial Render
    render();
  </script>
</body>
                                                                                     </html>
